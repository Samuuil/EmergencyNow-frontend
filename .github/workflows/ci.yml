name: CI

on:
  pull_request:
    branches:
      - dev
      - main

# Cancel superseded runs on the same PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (no emulator)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # These files are gitignored (they hold project-specific keys) but the build
      # references them, so CI recreates harmless placeholders. Unit tests never
      # contact Firebase or Google Maps, so the values are irrelevant.
      - name: Create placeholder google-services.json
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.example.emergencynow"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyCIplaceholderPlaceholderPlaceholder0" }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Create placeholder Google Maps API key resource
        run: |
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/google_maps_api.xml <<'XML'
          <resources>
              <string name="google_maps_key" templateMergeStrategy="preserve" translatable="false">PLACEHOLDER_MAPS_KEY</string>
          </resources>
          XML

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
